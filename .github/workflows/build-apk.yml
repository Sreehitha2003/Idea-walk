name: Build Idea Walk APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Show uploaded files
        run: find . -not -path './.git/*' -type f | sort

      - name: Build signed APK
        run: |
          DIR=$(dirname "$(find . -name settings.gradle -not -path './.git/*' | head -1)")
          echo "Project folder: $DIR"
          cd "$DIR"
          gradle --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/IdeaWalk.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: IdeaWalk-apk
          path: IdeaWalk.apk
